<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>that's a paddlin</title>
  <style>
    * { box-sizing: border-box; }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #050714;
      color: #f5f7ff;
      font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      overscroll-behavior: none;
    }

    #game {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100dvh;
      display: block;
      touch-action: none;
      user-select: none;
      outline: none;
      cursor: crosshair;
    }

    #actionButton {
      position: fixed;
      z-index: 3;
      left: 50%;
      bottom: max(22px, env(safe-area-inset-bottom));
      transform: translateX(-50%);
      border: 0;
      border-radius: 999px;
      padding: 13px 24px;
      color: #071018;
      background: #80f7ff;
      font-weight: 900;
      letter-spacing: 0.02em;
      box-shadow: 0 0 24px rgba(128, 247, 255, 0.34);
    }

    #actionButton[hidden] { display: none; }
  </style>
</head>
<body>
<canvas id="game" tabindex="0" aria-label="that's a paddlin game canvas"></canvas>
<button id="actionButton" type="button">Start game</button>

<script>
(() => {
  "use strict";

  const canvas = document.getElementById("game");
  const ctx = canvas.getContext("2d");
  const actionButton = document.getElementById("actionButton");

  let W = 960;
  let H = 600;
  let DPR = 1;

  const C = {
    text: "#f5f7ff",
    muted: "#a6afcf",
    cyan: "#80f7ff",
    pink: "#ff5f7e",
    gold: "#ffd166",
    purple: "#a98cff",
    green: "#80ff9a",
    blue: "#55a7ff",
    orange: "#ff9f43",
    red: "#ff3864",
    stone: "#858da9"
  };

  const CFG = {
    arena: { pad: 14 },

    paddle: {
      x: 60,
      w: 12,
      h: 56,
      enemyGap: 38,
      enemyH: 58,
      mouseFollow: 30,
      mouseBoost: 2.6,
      mousePrecision: 0.55,
      zoneMinX: 28,
      zoneMaxRatio: 0.30,
      zoneMaxCap: 320,

      angleFollow: 12,
      angleFromMoveX: 0.36,
      angleFromMoveY: 0.95,
      angleInputSpeed: 1.55,
      maxAngle: Math.PI * 160 / 180
    },

    ball: {
      r: 7,
      startSpeed: 560,
      minSpeed: 590,

      /*
        Soft caps only.
        Ball speed and spin can exceed these, but excess is gently compressed.
      */
      speedSoftCap: 1900,
      speedCompression: 0.985,

      maxSpin: 2.7,
      spinSoftCap: 1.55,
      spinCompression: 0.82,
      magnus: 0.74,
      spinDecay: 0.925,
      spinIntentCharge: 2.9,
      spinIntentDecay: 4.2,
      spinIntentHit: 0.95,
      spinBlockThreshold: 1.05,
      spinWallKickThreshold: 1.1,

      wallSpinKeep: 0.72,
      wallFriction: 0.035,
      wallSpinTransfer: 0.0014,
      wallExitBias: 8,
      spinBacktrackGuardRatio: 0.42,

      circleGuardAngularRatio: 1.35,
      circleGuardSpinBleed: 0.70,

      contactSpeedGain: 0.42,
      paddlePushGain: 0.66,

      centerStallSeconds: 2.65,
      centerProgressPixels: 90,
      centerEscapeHorizontalRatio: 0.72
    },

    blocks: {
      w: 32,
      h: 18,
      base: 12,
      max: 72,
      respawnBase: 2.7,
      respawnStep: 0.025,
      respawnMin: 0.45,
      marginX: 126,
      marginY: 78
    },

    rooms: 100
  };

  const clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, v));
  const rand = (lo, hi) => lo + Math.random() * (hi - lo);
  const pick = arr => arr[Math.floor(Math.random() * arr.length)];
  const speedOf = b => b ? Math.hypot(b.vx, b.vy) : 0;
  const radToDeg = r => r * 180 / Math.PI;

  const keys = new Set();

  const pointer = {
    active: false,
    x: CFG.paddle.x,
    y: H / 2,
    lastX: null,
    lastY: null
  };

  const store = {
    get(k, v) {
      try { return Number(localStorage.getItem(k) || v); }
      catch { return v; }
    },
    set(k, v) {
      try { localStorage.setItem(k, String(v)); }
      catch {}
    }
  };

  const state = {
    mode: "title",
    paused: false,
    room: 0,
    score: 0,
    best: store.get("thats-a-paddlin-best", 0),
    combo: 0,
    comboTimer: 0,
    freeServe: false,
    spinIntent: 0,
    last: performance.now(),
    flash: 0,
    message: "",
    messageTimer: 0,
    player: null,
    enemy: null,
    mods: null,
    balls: [],
    blocks: [],
    previews: [],
    particles: [],
    floats: [],
    draft: [],
    relics: []
  };

  const relics = [
    ["wide", "Giant Bat", "▌", "+22% paddle height.", () => state.mods.paddleScale += 0.22],
    ["boots", "Greased Boots", "⇅", "+18% paddle mouse response.", () => state.mods.paddleSpeed *= 1.18],
    ["heart", "Iron Heart", "♥", "+1 max HP and heal 1.", () => {
      state.mods.maxHp++;
      state.player.hp = Math.min(state.mods.maxHp, state.player.hp + 1);
    }],
    ["meteor", "Meteor Ball", "✦", "+1 ball damage.", () => state.mods.damage++],
    ["comet", "Comet Core", "●", "+12% ball speed.", () => state.mods.ballSpeed *= 1.12],
    ["echo", "Echo Orb", "◎", "+1 extra ball each room.", () => state.mods.extraBalls++],
    ["gyro", "Gyro Grip", "◌", "+40% spin power.", () => state.mods.spinPower *= 1.4],
    ["razor", "Razor Spin", "↯", "High-spin goals deal +1 damage.", () => state.mods.spinDamage = true],
    ["rust", "Rust Hex", "⌁", "Enemy paddle is 14% slower.", () => state.mods.enemySlow *= 0.86],
    ["shield", "Glass Aegis", "◇", "+1 shield against a miss.", () => state.mods.shield++],
    ["luck", "Lucky Edge", "⚅", "+12% chance to double damage.", () => state.mods.crit += 0.12]
  ];

  relics.push(
    ["combo", "Golden Rhythm", "*", "Combos last longer and pay 12% more.", () => {
      state.mods.comboWindow += 0.65;
      state.mods.scoreScale *= 1.12;
    }],
    ["phase", "Phase Chip", "~", "Portal and splitter blocks are safer to exploit.", () => state.mods.phaseSafe = true],
    ["snare", "Static Snare", "#", "Bonus blocks stun the enemy longer.", () => state.mods.enemyStunBonus += 0.18]
  );

  const relicDeck = relics.map(([id, name, icon, desc, apply]) => ({ id, name, icon, desc, apply }));

  function baseMods() {
    return {
      paddleScale: 1,
      paddleSpeed: 1,
      ballSpeed: 1,
      damage: 1,
      radius: CFG.ball.r,
      spinPower: 1,
      spinDamage: false,
      extraBalls: 0,
      maxHp: 5,
      shield: 0,
      enemySlow: 1,
      crit: 0,
      comboWindow: 2,
      scoreScale: 1,
      phaseSafe: false,
      enemyStunBonus: 0
    };
  }

  function level() {
    return clamp(state.room, 0, CFG.rooms);
  }

  function levelT() {
    return level() / CFG.rooms;
  }

  function levelBand() {
    const l = level();
    if (l < 10) return "calibration";
    if (l < 40) return "pressure";
    if (l < 75) return "overdrive";
    return "apex";
  }

  function resize() {
    DPR = Math.min(devicePixelRatio || 1, 2);
    W = Math.max(360, innerWidth || 960);
    H = Math.max(420, innerHeight || 600);

    canvas.width = Math.floor(W * DPR);
    canvas.height = Math.floor(H * DPR);
    canvas.style.width = W + "px";
    canvas.style.height = H + "px";
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);

    if (state.player) state.player.x = clamp(state.player.x, playerZone().minX, playerZone().maxX);
    if (state.enemy) state.enemy.x = clamp(state.enemy.x, enemyZone().minX, enemyZone().maxX);

    clampActors();
  }

  function playerZone() {
    return {
      minX: CFG.paddle.zoneMinX,
      maxX: Math.min(CFG.paddle.zoneMaxCap, W * CFG.paddle.zoneMaxRatio),
      minY: 24,
      maxY: H - 24
    };
  }

  function clampActors() {
    if (state.player) {
      const z = playerZone();
      state.player.x = clamp(state.player.x, z.minX + state.player.w / 2, z.maxX);
      state.player.y = clamp(state.player.y, 24 + state.player.h / 2, H - 24 - state.player.h / 2);
    }

    if (state.enemy) {
      const z = enemyZone();
      state.enemy.x = clamp(state.enemy.x, z.minX, z.maxX);
      state.enemy.y = clamp(state.enemy.y, 24 + state.enemy.h / 2, H - 24 - state.enemy.h / 2);
    }

    for (const b of state.balls) {
      b.x = clamp(b.x, 30, W - 30);
      b.y = clamp(b.y, 30, H - 30);
    }
  }

  function enemyZone() {
    const width = Math.min(CFG.paddle.zoneMaxCap, W * CFG.paddle.zoneMaxRatio);
    return {
      minX: W - width,
      maxX: W - CFG.paddle.zoneMinX,
      minY: 24,
      maxY: H - 24
    };
  }

  function makePaddle(x, y, color, hp, h, speed) {
    return {
      x,
      y,
      oldX: x,
      oldY: y,
      vx: 0,
      vy: 0,
      w: CFG.paddle.w,
      h,
      baseH: h,
      speed,
      hp,
      maxHp: hp,
      color,
      invuln: 0,
      stun: 0,
      angle: 0,
      manualAngle: 0,
      angleLocked: false
    };
  }

  function makeEnemy() {
    const t = levelT();
    const hp = 3 + Math.floor(level() * 0.72 + t * t * 18);

    return makePaddle(
      W - CFG.paddle.enemyGap,
      H / 2,
      pick([C.purple, C.pink, C.green, C.gold, C.blue]),
      hp,
      CFG.paddle.enemyH + level() * 0.22,
      230 + t * 760
    );
  }

  function targetBlocks() {
    return clamp(CFG.blocks.base + Math.floor(level() * 0.72), CFG.blocks.base, CFG.blocks.max);
  }

  function respawnDelay() {
    return clamp(CFG.blocks.respawnBase - level() * CFG.blocks.respawnStep, CFG.blocks.respawnMin, CFG.blocks.respawnBase);
  }

  function blockType() {
    const l = level();
    const roll = Math.random();
    const table = [
      ["brick", 1],
      ["bonus", l >= 4 ? 0.09 : 0],
      ["stone", l >= 8 ? 0.18 : 0],
      ["spike", l >= 12 ? 0.13 : 0],
      ["splitter", l >= 18 ? 0.11 : 0],
      ["portal", l >= 26 ? 0.10 : 0],
      ["moving", l >= 34 ? 0.11 : 0],
      ["regen", l >= 48 ? 0.09 : 0],
      ["shielded", l >= 62 ? 0.08 : 0],
      ["bomb", l >= 74 ? 0.07 : 0],
      ["boss", l >= 90 ? 0.04 : 0]
    ];
    const total = table.reduce((sum, [, weight]) => sum + weight, 0);
    let cursor = roll * total;

    for (const [type, weight] of table) {
      cursor -= weight;
      if (cursor <= 0) return type;
    }

    return "brick";
  }

  function blockHp(t) {
    if (t === "boss") return 7;
    if (t === "shielded") return 4;
    if (t === "stone" || t === "regen") return 3;
    if (t === "portal" || t === "moving" || t === "splitter") return 2;
    return 1;
  }

  function blockColor(b) {
    return b.type === "stone" ? C.stone :
      b.type === "spike" ? C.pink :
      b.type === "portal" ? C.purple :
      b.type === "splitter" ? C.blue :
      b.type === "moving" ? C.green :
      b.type === "regen" ? C.orange :
      b.type === "shielded" ? C.cyan :
      b.type === "bomb" ? C.red :
      b.type === "boss" ? C.text :
      b.type === "bonus" ? C.gold :
      C.gold;
  }

  function makeBlock(x, y, type) {
    const hp = blockHp(type);
    return {
      x,
      y,
      baseX: x,
      baseY: y,
      w: type === "boss" ? CFG.blocks.w * 1.75 : CFG.blocks.w,
      h: type === "boss" ? CFG.blocks.h * 1.45 : CFG.blocks.h,
      type,
      hp,
      maxHp: hp,
      phase: rand(0, Math.PI * 2),
      regen: 0
    };
  }

  function overlap(a, b, pad = 14) {
    return a.x < b.x + b.w + pad &&
           a.x + a.w + pad > b.x &&
           a.y < b.y + b.h + pad &&
           a.y + a.h + pad > b.y;
  }

  function spawnRect() {
    const { w, h, marginX, marginY } = CFG.blocks;
    const minX = Math.max(marginX, CFG.arena.pad + 8);
    const maxX = W - Math.max(marginX, CFG.arena.pad + 8) - w;
    const minY = marginY;
    const maxY = H - marginY - h;
    const existing = state.blocks.concat(state.previews);

    for (let i = 0; i < 120; i++) {
      const c = {
        x: rand(minX, Math.max(minX + 1, maxX)),
        y: rand(minY, Math.max(minY + 1, maxY)),
        w,
        h
      };

      if (!existing.some(e => overlap(c, e, 16))) return c;
    }

    return {
      x: rand(minX, Math.max(minX + 1, maxX)),
      y: rand(minY, Math.max(minY + 1, maxY)),
      w,
      h
    };
  }

  function scheduleBlock(delay = respawnDelay()) {
    const r = spawnRect();
    state.previews.push({ ...r, type: blockType(), time: delay, total: delay });
  }

  function fillBlocks() {
    state.blocks = [];
    state.previews = [];

    for (let i = 0; i < targetBlocks(); i++) {
      const r = spawnRect();
      state.blocks.push(makeBlock(r.x, r.y, blockType()));
    }
  }

  function updatePreviews(dt) {
    while (state.blocks.length + state.previews.length < targetBlocks()) scheduleBlock();

    for (let i = state.previews.length - 1; i >= 0; i--) {
      const p = state.previews[i];
      p.time -= dt;

      if (p.time <= 0) {
        state.blocks.push(makeBlock(p.x, p.y, p.type));
        burst(p.x + p.w / 2, p.y + p.h / 2, blockColor(p), 14);
        state.previews.splice(i, 1);
      }
    }
  }

  function newRun() {
    Object.assign(state, {
      mode: "playing",
      paused: false,
      room: 0,
      score: 0,
      combo: 0,
      comboTimer: 0,
      freeServe: true,
      spinIntent: 0,
      flash: 0,
      message: "Free serve",
      messageTimer: 2,
      balls: [],
      blocks: [],
      previews: [],
      particles: [],
      floats: [],
      draft: [],
      relics: [],
      mods: baseMods()
    });

    const z = playerZone();

    state.player = makePaddle(
      clamp(CFG.paddle.x, z.minX, z.maxX),
      H / 2,
      C.cyan,
      5,
      CFG.paddle.h,
      CFG.paddle.mouseFollow
    );

    pointer.active = false;
    pointer.x = state.player.x;
    pointer.y = state.player.y;

    state.enemy = makeEnemy();
    fillBlocks();
    prepareFreeServe();
    canvas.focus();
    syncButton();
  }

  function prepareFreeServe() {
    state.freeServe = true;
    state.balls = [];
    state.message = "Level " + state.room + " - Free serve";
    state.messageTimer = 2;
  }

  function launchFreeServe() {
    if (state.mode !== "playing" || !state.freeServe) return false;

    state.freeServe = false;
    serve(1 + state.mods.extraBalls, 1, true);
    return true;
  }

  function serve(count = 1, forcedDir = null, fromPlayer = false) {
    for (let i = 0; i < count; i++) {
      const dir = forcedDir || (Math.random() < 0.5 ? -1 : 1);
      const sp = (CFG.ball.startSpeed + level() * 5.5) * state.mods.ballSpeed;
      const a = rand(-0.42, 0.42);
      const sx = fromPlayer && state.player ? state.player.x + 34 + i * 10 : W / 2 + rand(-18, 18);
      const sy = fromPlayer && state.player ? state.player.y + rand(-18, 18) : H / 2 + rand(-70, 70);

      state.balls.push({
        x: sx,
        y: clamp(sy, CFG.arena.pad + CFG.ball.r, H - CFG.arena.pad - CFG.ball.r),
        vx: Math.cos(a) * sp * dir,
        vy: Math.sin(a) * sp,
        r: state.mods.radius,
        damage: state.mods.damage,
        spin: 0,
        lift: 0,
        contactSpeed: 0,
        paddleSpeedAtContact: 0,
        lastHit: "none",
        wallBounceStreak: 0,
        lastWallBounceAt: 0,
        stallTimer: 0,
        stallAnchorX: W / 2,
        stallAnchorY: H / 2,
        trail: []
      });
    }
  }

  function createDraft() {
    const repeat = ["heart", "shield", "luck", "meteor", "comet"];
    const pool = relicDeck.filter(r => !state.relics.includes(r.id) || repeat.includes(r.id));

    state.draft = [];

    while (state.draft.length < 3 && pool.length) {
      const r = pick(pool);
      if (!state.draft.includes(r)) state.draft.push(r);
    }

    state.mode = "upgrade";
    state.message = "Choose an upgrade";
    state.messageTimer = 1.1;
    syncButton();
  }

  function chooseRelic(i) {
    if (state.mode !== "upgrade" || !state.draft[i]) return;

    const r = state.draft[i];
    r.apply();
    state.relics.push(r.id);
    state.room++;

    if (state.room > CFG.rooms) {
      state.mode = "victory";
      saveBest();
      syncButton();
      return;
    }

    state.balls = [];
    state.enemy = makeEnemy();
    fillBlocks();
    state.mode = "playing";
    prepareFreeServe();
    syncButton();
  }

  function update(dt) {
    if (state.mode !== "playing" || state.paused) {
      updateEffects(dt);
      return;
    }

    state.messageTimer = Math.max(0, state.messageTimer - dt);
    state.comboTimer = Math.max(0, state.comboTimer - dt);
    if (state.comboTimer === 0) state.combo = 0;

    state.flash = Math.max(0, state.flash - dt * 1.7);
    state.player.invuln = Math.max(0, state.player.invuln - dt);
    state.enemy.stun = Math.max(0, state.enemy.stun - dt);

    updatePreviews(dt);
    updateBlocks(dt);
    updatePlayer(dt);
    updateEnemy(dt);
    updateBalls(dt);
    updateEffects(dt);

    if (!state.balls.length && state.mode === "playing" && !state.freeServe) serve(1);
  }

  function updateBlocks(dt) {
    const now = performance.now() / 1000;

    for (const b of state.blocks) {
      if (b.type === "moving") {
        b.x = b.baseX + Math.sin(now * (1.4 + levelT() * 1.8) + b.phase) * (18 + levelT() * 30);
        b.y = b.baseY + Math.cos(now * 1.1 + b.phase) * (8 + levelT() * 18);
      }

      if (b.type === "regen" && b.hp < b.maxHp) {
        b.regen += dt;
        if (b.regen > Math.max(0.9, 2.8 - levelT() * 1.4)) {
          b.hp++;
          b.regen = 0;
          floatText(b.x + b.w / 2, b.y, "REGEN", C.orange);
        }
      }
    }
  }

  function paddleFollowMultiplier() {
    let m = state.mods ? state.mods.paddleSpeed : 1;

    if (keys.has("ShiftLeft") || keys.has("ShiftRight")) m *= CFG.paddle.mouseBoost;
    if (keys.has("AltLeft") || keys.has("AltRight") || keys.has("ControlLeft") || keys.has("ControlRight")) {
      m *= CFG.paddle.mousePrecision;
    }

    return m;
  }

  function updatePlayer(dt) {
    const p = state.player;
    const z = playerZone();

    p.h = p.baseH * state.mods.paddleScale;
    p.oldX = p.x;
    p.oldY = p.y;

    const follow = p.speed * paddleFollowMultiplier();

    if (pointer.active) {
      p.x += (pointer.x - p.x) * clamp(dt * follow, 0, 1);
      p.y += (pointer.y - p.y) * clamp(dt * follow, 0, 1);
    }

    p.x = clamp(p.x, z.minX + p.w / 2, z.maxX);
    p.y = clamp(p.y, 24 + p.h / 2, H - 24 - p.h / 2);

    p.vx = (p.x - p.oldX) / Math.max(dt, 0.001);
    p.vy = (p.y - p.oldY) / Math.max(dt, 0.001);

    updatePlayerAngle(p, dt);
  }

  function updatePlayerAngle(p, dt) {
    const left = keys.has("KeyA") || keys.has("ArrowLeft") || keys.has("KeyQ");
    const right = keys.has("KeyD") || keys.has("ArrowRight") || keys.has("KeyE");
    const dir = (right ? 1 : 0) - (left ? 1 : 0);

    updateSpinIntent(dir, dt);

    if (dir !== 0) {
      const fast = keys.has("ShiftLeft") || keys.has("ShiftRight") ? 1.85 : 1;
      p.angleLocked = true;
      p.manualAngle += dir * CFG.paddle.angleInputSpeed * fast * dt;
      p.manualAngle = clamp(p.manualAngle, -CFG.paddle.maxAngle, CFG.paddle.maxAngle);
    }

    let target;

    if (p.angleLocked) {
      target = p.manualAngle;
    } else {
      target = Math.atan2(
        p.vy * CFG.paddle.angleFromMoveY - p.vx * CFG.paddle.angleFromMoveX,
        420
      ) * 1.7;

      target = clamp(target, -CFG.paddle.maxAngle, CFG.paddle.maxAngle);
    }

    p.angle += (target - p.angle) * clamp(dt * CFG.paddle.angleFollow, 0, 1);
    p.angle = clamp(p.angle, -CFG.paddle.maxAngle, CFG.paddle.maxAngle);
  }

  function updateSpinIntent(dir, dt) {
    if (dir) {
      state.spinIntent = clamp(
        state.spinIntent + dir * CFG.ball.spinIntentCharge * dt,
        -1,
        1
      );
      return;
    }

    const decay = CFG.ball.spinIntentDecay * dt;

    if (Math.abs(state.spinIntent) <= decay) {
      state.spinIntent = 0;
    } else {
      state.spinIntent -= Math.sign(state.spinIntent) * decay;
    }
  }

  function updateEnemy(dt) {
    const e = state.enemy;
    const z = enemyZone();
    const t = levelT();

    e.oldX = e.x;
    e.oldY = e.y;

    if (e.stun > 0) {
      e.vy = 0;
      return;
    }

    const target = state.balls.filter(b => b.vx > 0).sort((a, b) => b.x - a.x)[0] || state.balls[0];
    let tx = z.maxX - e.w / 2;
    let ty = H / 2;

    if (target) {
      const travel = target.vx > 0 ? Math.max(0, (e.x - target.x) / Math.max(target.vx, 1)) : 0.18;
      const prediction = predictBallY(target, travel * (0.08 + t * 0.92));
      const wobble = Math.sin(performance.now() / (720 - t * 430) + state.room) * (46 * (1 - t));
      const mistake = rand(-1, 1) * (72 * (1 - t) ** 1.7);
      const chaseLead = clamp((target.x - W * 0.5) / (W * 0.5), 0, 1);

      ty = prediction + wobble + mistake;
      tx = z.maxX - e.w / 2 - chaseLead * (z.maxX - z.minX) * (0.18 + t * 0.68);
    }

    const delay = 0.30 * (1 - t);
    const agility = e.speed * state.mods.enemySlow * (0.44 + t * 0.86);
    const step = agility * dt * (1 - delay);

    e.x += clamp(tx - e.x, -step, step);
    e.y += clamp(ty - e.y, -step, step);
    e.x = clamp(e.x, z.minX, z.maxX - e.w / 2);
    e.y = clamp(e.y, 24 + e.h / 2, H - 24 - e.h / 2);

    e.vx = (e.x - e.oldX) / Math.max(dt, 0.001);
    e.vy = (e.y - e.oldY) / Math.max(dt, 0.001);
    e.angle = 0;
  }

  function predictBallY(b, seconds) {
    let y = b.y + b.vy * seconds;
    const top = CFG.arena.pad + b.r;
    const bottom = H - CFG.arena.pad - b.r;
    const span = bottom - top;

    if (span <= 0) return b.y;

    y = (y - top) % (span * 2);
    if (y < 0) y += span * 2;
    if (y > span) y = span * 2 - y;

    return top + y;
  }

  function updateBalls(dt) {
    for (let i = state.balls.length - 1; i >= 0; i--) {
      const b = state.balls[i];

      b.trail.push({ x: b.x, y: b.y, life: 0.22 });
      if (b.trail.length > 18) b.trail.shift();

      b.trail.forEach(t => t.life -= dt);
      b.trail = b.trail.filter(t => t.life > 0);

      applySpin(b, dt);
      stabilize(b);

      b.x += b.vx * dt;
      b.y += b.vy * dt;

      if (b.y < CFG.arena.pad + b.r) wallBounce(b, true);
      if (b.y > H - CFG.arena.pad - b.r) wallBounce(b, false);

      collidePaddle(b, state.player, true);
      collidePaddle(b, state.enemy, false);
      collideBlocks(b);

      stabilize(b);
      updateCenterStall(b, dt);

      if (b.x < -48) {
        state.balls.splice(i, 1);
        hurtPlayer(1);
      } else if (b.x > W + 48) {
        state.balls.splice(i, 1);

        let dmg = b.damage;

        if (state.mods.spinDamage && Math.abs(b.spin) > 0.75) {
          dmg++;
          floatText(W - 80, b.y, "SPIN +1", C.cyan);
        }

        hitEnemy(dmg, W - 70, b.y);
      }
    }
  }

  function applySpin(b, dt) {
    b.lift = 0;

    if (Math.abs(b.spin) < 0.01) return;

    const sp = speedOf(b);
    if (sp < 1) return;

    const nx = -b.vy / sp;
    const ny = b.vx / sp;

    /*
      Magnus-style lift: perpendicular to velocity.
      Soft-limited so high spin curves without entering circular orbit.
    */
    const usableSpin = softLimitSigned(
      b.spin,
      CFG.ball.spinSoftCap,
      CFG.ball.spinCompression
    );

    const lift = usableSpin * CFG.ball.magnus * sp;

    b.vx += nx * lift * dt;
    b.vy += ny * lift * dt;

    b.spin *= Math.pow(CFG.ball.spinDecay, dt);
    b.spin = softLimitSigned(
      b.spin,
      CFG.ball.spinSoftCap * 1.18,
      CFG.ball.spinCompression
    );

    b.lift = Math.abs(lift);

    preventCircleOrbit(b);
    preventSpinBacktrack(b);
  }

  function softLimit(value, softCap, compression) {
    if (!Number.isFinite(value)) return softCap;
    if (value <= softCap) return value;

    const excess = value - softCap;
    return softCap + excess * compression;
  }

  function softLimitSigned(value, softCap, compression) {
    const sign = Math.sign(value || 1);
    return sign * softLimit(Math.abs(value), softCap, compression);
  }

  function applySpeedSoftCap(b) {
    const sp = speedOf(b);
    if (sp <= CFG.ball.speedSoftCap) return;

    const limited = softLimit(sp, CFG.ball.speedSoftCap, CFG.ball.speedCompression);
    const scale = limited / sp;

    b.vx *= scale;
    b.vy *= scale;
  }

  function applySpinNaturalCap(b) {
    b.spin = softLimitSigned(b.spin, CFG.ball.spinSoftCap, CFG.ball.spinCompression);
  }

  function preventCircleOrbit(b) {
    const sp = speedOf(b);
    if (sp < 1) return;

    const curvature = Math.abs(b.lift) / Math.max(sp, 1);
    const excessiveCurve = curvature > CFG.ball.circleGuardAngularRatio;

    if (!excessiveCurve) return;

    b.spin *= CFG.ball.circleGuardSpinBleed;

    const dir = b.vx < 0 ? -1 : 1;
    const minForward = sp * 0.38;

    if (Math.abs(b.vx) < minForward) {
      b.vx = dir * minForward;
    }
  }

  function preventSpinBacktrack(b) {
    if (b.lastHit !== "player" && b.lastHit !== "enemy") return;

    const sp = speedOf(b);
    if (sp < 1) return;

    const dir = b.lastHit === "player" ? 1 : -1;
    const minForward = sp * CFG.ball.spinBacktrackGuardRatio;

    if (b.vx * dir < minForward) {
      b.vx = dir * minForward;
      b.vy = clamp(b.vy, -sp * 0.86, sp * 0.86);
      b.spin *= 0.55;
    }
  }

  function stabilize(b, force = false) {
    if (!Number.isFinite(b.vx) || !Number.isFinite(b.vy)) {
      const d = Math.random() < 0.5 ? -1 : 1;

      Object.assign(b, {
        vx: d * CFG.ball.minSpeed,
        vy: rand(-130, 130),
        spin: 0,
        lift: 0,
        wallBounceStreak: 0,
        stallTimer: 0
      });

      return;
    }

    const sp = speedOf(b);

    if (sp < CFG.ball.minSpeed) {
      const s = CFG.ball.minSpeed / Math.max(sp, 1);
      b.vx *= s;
      b.vy *= s;
    }

    if (force) {
      escapeBall(b);
    }

    applySpeedSoftCap(b);
    applySpinNaturalCap(b);
    preventSpinBacktrack(b);

    /*
      No hard trajectory-angle limiting.
      Only soft speed/spin compression and anti-orbit protection are applied.
    */
  }

  function escapeBall(b) {
    const sp = Math.max(speedOf(b), CFG.ball.minSpeed);
    const dir =
      b.lastHit === "player" ? 1 :
      b.lastHit === "enemy" ? -1 :
      b.vx < 0 ? -1 : 1;

    const ySign = Math.sign(b.vy || rand(-1, 1));
    const angle = rand(0.22, 0.46);

    b.vx = dir * Math.cos(angle) * sp;
    b.vy = ySign * Math.sin(angle) * sp;
    b.spin *= 0.72;
    b.wallBounceStreak = 0;
    b.stallTimer = 0;
    b.stallAnchorX = b.x;
    b.stallAnchorY = b.y;

    floatText(b.x, b.y, "ESCAPE", C.cyan);
  }

  function updateCenterStall(b, dt) {
    const inCenter = b.x > W * 0.31 && b.x < W * 0.69;
    const moved = Math.hypot(b.x - b.stallAnchorX, b.y - b.stallAnchorY);

    if (!inCenter || moved > CFG.ball.centerProgressPixels) {
      b.stallTimer = 0;
      b.stallAnchorX = b.x;
      b.stallAnchorY = b.y;
      return;
    }

    b.stallTimer += dt;

    if (b.stallTimer > CFG.ball.centerStallSeconds) {
      const sp = Math.max(speedOf(b), CFG.ball.minSpeed * 1.12);
      const dir =
        b.lastHit === "player" ? 1 :
        b.lastHit === "enemy" ? -1 :
        b.vx < 0 ? -1 : 1;

      b.vx = dir * Math.max(Math.abs(b.vx), sp * CFG.ball.centerEscapeHorizontalRatio);

      const maxVy = Math.abs(b.vx) * 0.74;
      b.vy = clamp(b.vy, -maxVy, maxVy);

      if (Math.abs(b.vy) < 40) {
        b.vy += rand(-110, 110);
      }

      b.spin *= 0.85;
      b.stallTimer = 0;
      b.stallAnchorX = b.x;
      b.stallAnchorY = b.y;

      floatText(b.x, b.y, "TUNNEL", C.purple);
      burst(b.x, b.y, C.purple, 18);
    }
  }

  function wallBounce(b, top) {
    const now = performance.now();

    if (!b.lastWallBounceAt || now - b.lastWallBounceAt > 1200) {
      b.wallBounceStreak = 0;
    }

    b.lastWallBounceAt = now;
    b.wallBounceStreak++;

    if (top) {
      b.y = CFG.arena.pad + b.r;
      b.vy = Math.abs(b.vy);
    } else {
      b.y = H - CFG.arena.pad - b.r;
      b.vy = -Math.abs(b.vy);
    }

    applyWallSpin(b, top);
    stabilize(b, b.wallBounceStreak >= 3);
    burst(b.x, b.y, C.cyan, b.wallBounceStreak >= 2 ? 18 : 8);

    if (Math.abs(b.spin) >= CFG.ball.spinWallKickThreshold) {
      floatText(
        b.x,
        b.y + (top ? 22 : -16),
        "KICK",
        b.spin > 0 ? C.gold : C.purple
      );
    }
  }

  function applyWallSpin(b, top) {
    const normal = top ? 1 : -1;
    const surfaceV = b.spin * b.r * normal;
    const slip = b.vx - surfaceV;

    b.vx += -slip * CFG.ball.wallFriction;
    b.spin += slip * CFG.ball.wallSpinTransfer * normal;
    b.spin = softLimitSigned(
      b.spin * CFG.ball.wallSpinKeep,
      CFG.ball.spinSoftCap * 0.82,
      CFG.ball.spinCompression
    );

    if (Math.abs(b.spin) > 0.06) {
      b.vx += Math.sign(b.vx || 1) * Math.abs(b.spin) * CFG.ball.wallExitBias;
      b.vy += Math.sign(b.vy || normal) * Math.abs(b.spin) * 12;
    }

    preventSpinBacktrack(b);
  }

  function paddleRect(p) {
    return { x: p.x, y: p.y - p.h / 2, w: p.w, h: p.h };
  }

  function rectCircle(r, b) {
    const cx = clamp(b.x, r.x, r.x + r.w);
    const cy = clamp(b.y, r.y, r.y + r.h);
    return (b.x - cx) ** 2 + (b.y - cy) ** 2 <= b.r ** 2;
  }

  function rotatedRectCircle(p, b) {
    const dx = b.x - p.x;
    const dy = b.y - p.y;
    const ca = Math.cos(-p.angle);
    const sa = Math.sin(-p.angle);

    const lx = dx * ca - dy * sa;
    const ly = dx * sa + dy * ca;

    const hw = p.w / 2;
    const hh = p.h / 2;
    const cx = clamp(lx, -hw, hw);
    const cy = clamp(ly, -hh, hh);
    const ddx = lx - cx;
    const ddy = ly - cy;

    return {
      hit: ddx * ddx + ddy * ddy <= b.r * b.r,
      lx,
      ly,
      rel: clamp(ly / hh, -1, 1)
    };
  }

  function collidePaddle(b, p, player) {
    const hit = player
      ? rotatedRectCircle(p, b)
      : {
          hit: rectCircle(paddleRect(p), b),
          rel: clamp((b.y - p.y) / (p.h / 2), -1, 1)
        };

    if (!hit.hit) return;
    if (player && b.vx > 0) return;
    if (!player && b.vx < 0) return;

    const rel = hit.rel;
    const incomingSpeed = Math.max(CFG.ball.minSpeed, speedOf(b));

    if (player) {
      const normal = {
        x: Math.cos(p.angle),
        y: Math.sin(p.angle)
      };

      const tangent = {
        x: -Math.sin(p.angle),
        y: Math.cos(p.angle)
      };

      const ballNormalSpeed = -(b.vx * normal.x + b.vy * normal.y);
      const paddleNormalSpeed = p.vx * normal.x + p.vy * normal.y;
      const paddleTangentSpeed = p.vx * tangent.x + p.vy * tangent.y;
      const paddleMoveSpeed = Math.hypot(p.vx, p.vy);

      const relativeContactSpeed = Math.max(0, ballNormalSpeed + paddleNormalSpeed);
      const forwardPush = Math.max(0, paddleNormalSpeed);

      /*
        Uncapped contact-speed model.
        A harder/faster paddle strike can keep increasing ball speed.
      */
      const contactBoost =
        relativeContactSpeed * CFG.ball.contactSpeedGain +
        forwardPush * CFG.ball.paddlePushGain;

      const outgoingSpeed = Math.max(
        CFG.ball.minSpeed,
        incomingSpeed * 0.97 + contactBoost
      );

      const launch = p.angle + rel * 0.52;

      const chargedSpin = state.spinIntent;
      const spinFromContact = clamp(
        paddleTangentSpeed / 650 +
        paddleNormalSpeed / 1200 +
        p.angle * 0.18 +
        rel * 0.35 +
        chargedSpin * CFG.ball.spinIntentHit,
        -2.2,
        2.2
      );

      b.spin = clamp(
        b.spin * 0.28 + spinFromContact * state.mods.spinPower,
        -CFG.ball.maxSpin,
        CFG.ball.maxSpin
      );

      b.vx = Math.cos(launch) * outgoingSpeed + tangent.x * paddleTangentSpeed * 0.08;
      b.vy = Math.sin(launch) * outgoingSpeed + tangent.y * paddleTangentSpeed * 0.08 + rand(-5, 5);

      b.contactSpeed = relativeContactSpeed;
      b.paddleSpeedAtContact = paddleMoveSpeed;

      b.x = p.x + Math.cos(p.angle) * (p.w / 2 + b.r + 1);
      b.y = p.y + Math.sin(p.angle) * (p.w / 2 + b.r + 1) + rel * p.h * 0.36;

      if (Math.abs(chargedSpin) > 0.35) {
        b.vy += chargedSpin * 70;
        floatText(b.x, b.y - 34, "SPIN LOAD", chargedSpin > 0 ? C.gold : C.purple);
      }

      state.spinIntent *= 0.34;
    } else {
      const a = rel * 0.82;
      const tangential = clamp(p.vy / 620 + rel * 0.46, -1.7, 1.7);
      const outgoingSpeed = Math.max(CFG.ball.minSpeed, incomingSpeed * 1.08);

      b.spin = clamp(
        b.spin * 0.28 + tangential * 0.7,
        -CFG.ball.maxSpin,
        CFG.ball.maxSpin
      );

      b.vx = -Math.cos(a) * outgoingSpeed;
      b.vy = Math.sin(a) * outgoingSpeed + p.vy * 0.15 + rand(-7, 7);

      b.contactSpeed = incomingSpeed;
      b.paddleSpeedAtContact = Math.abs(p.vy);

      b.x = p.x - b.r - 1;
    }

    b.lastHit = player ? "player" : "enemy";
    b.wallBounceStreak = 0;
    b.stallTimer = 0;
    b.stallAnchorX = b.x;
    b.stallAnchorY = b.y;

    stabilize(b);

    burst(
      b.x,
      b.y,
      player ? C.cyan : p.color,
      Math.abs(b.spin) > 0.65 ? 22 : 12
    );

    if (Math.abs(b.spin) > 0.65) {
      floatText(
        b.x,
        b.y - 18,
        b.spin > 0 ? "TOPSPIN" : "BACKSPIN",
        b.spin > 0 ? C.gold : C.purple
      );
    }

    if (player && b.contactSpeed > 520) {
      floatText(b.x, b.y + 22, "POWER " + b.contactSpeed.toFixed(0), C.gold);
    }
  }

  function collideBlocks(b) {
    for (let i = state.blocks.length - 1; i >= 0; i--) {
      const block = state.blocks[i];

      if (!rectCircle(block, b)) continue;

      const cx = block.x + block.w / 2;
      const cy = block.y + block.h / 2;
      const dx = (b.x - cx) / (block.w / 2);
      const dy = (b.y - cy) / (block.h / 2);

      if (Math.abs(dx) > Math.abs(dy)) {
        const side = dx >= 0 ? 1 : -1;
        b.vx = Math.abs(b.vx) * side;
        b.x = cx + side * (block.w / 2 + b.r + 0.8);
        b.spin *= 0.96;
      } else {
        const side = dy >= 0 ? 1 : -1;
        b.vy = Math.abs(b.vy) * side;
        b.y = cy + side * (block.h / 2 + b.r + 0.8);
        b.spin *= 0.94;
      }

      b.wallBounceStreak = 0;
      stabilize(b);

      const shielded = block.type === "shielded" && block.hp === block.maxHp;
      const spinBreak = Math.abs(b.spin) >= CFG.ball.spinBlockThreshold;
      const hitDamage = b.damage + (spinBreak && !shielded ? 1 : 0);

      block.hp -= shielded ? 0 : hitDamage;
      if (shielded) {
        block.type = "stone";
        block.hp = Math.max(2, block.hp - 1);
        floatText(cx, cy, "SHIELD BREAK", C.cyan);
      }

      const hitScore = block.type === "stone" ? 28 : block.type === "boss" ? 45 : 18;
      addScore(hitScore * hitDamage, cx, cy);
      burst(cx, cy, blockColor(block), spinBreak && !shielded ? 22 : 12);

      if (spinBreak && !shielded) {
        b.spin *= 0.82;
        floatText(cx, cy - 20, "SPIN HIT", b.spin > 0 ? C.gold : C.purple);
      }

      if (block.type === "portal") {
        b.y = H - b.y;
        b.vx *= state.mods.phaseSafe ? 1.12 : 1.04;
        b.vy += state.mods.phaseSafe ? rand(-45, 45) : rand(-90, 90);
        stabilize(b);
        burst(b.x, b.y, C.purple, 20);
      }

      if (block.type === "splitter" && state.balls.length < 5 + Math.floor(levelT() * 4)) {
        splitBall(b, cx, cy);
      }

      if (block.type === "bonus") {
        applyBonusBlock(b, cx, cy);
      }

      if (block.type === "spike" && b.lastHit !== "player" && !state.mods.phaseSafe) hurtPlayer(1);

      if (block.hp <= 0) {
        state.blocks.splice(i, 1);
        scheduleBlock();
        applyBreakEffect(block, b, cx, cy);
        addScore(blockScore(block), cx, cy, block.type.toUpperCase());
      }

      return;
    }
  }

  function splitBall(source, x, y) {
    const sp = Math.max(CFG.ball.minSpeed, speedOf(source) * 0.92);
    const dir = source.vx >= 0 ? 1 : -1;

    state.balls.push({
      ...source,
      x,
      y,
      vx: dir * Math.cos(0.38) * sp,
      vy: -Math.sign(source.vy || 1) * Math.sin(0.38) * sp,
      spin: -source.spin * 0.7,
      trail: []
    });

    floatText(x, y - 20, "SPLIT", C.blue);
  }

  function applyBonusBlock(b, x, y) {
    const effects = level() < 20
      ? ["heal", "slow", "score"]
      : level() < 55
        ? ["heal", "slow", "score", "speed", "stun", "shield"]
        : ["heal", "slow", "score", "speed", "stun", "shield", "curve", "multiball"];
    const effect = pick(effects);

    if (effect === "heal") {
      state.player.hp = Math.min(state.mods.maxHp, state.player.hp + 1);
      floatText(x, y, "HEAL", C.green);
    } else if (effect === "slow") {
      for (const ball of state.balls) {
        ball.vx *= 0.88;
        ball.vy *= 0.88;
      }
      floatText(x, y, "SLOW FIELD", C.cyan);
    } else if (effect === "score") {
      addScore(250 + level() * 8, x, y, "BONUS");
    } else if (effect === "speed") {
      b.vx *= 1.16;
      b.vy *= 1.16;
      floatText(x, y, "BOOST", C.gold);
    } else if (effect === "stun") {
      state.enemy.stun = Math.max(state.enemy.stun, 0.45 + state.mods.enemyStunBonus);
      floatText(x, y, "SNARE", C.purple);
    } else if (effect === "shield") {
      state.mods.shield++;
      floatText(x, y, "AEGIS", C.cyan);
    } else if (effect === "curve") {
      b.spin = clamp(b.spin + rand(-1.4, 1.4), -CFG.ball.maxSpin, CFG.ball.maxSpin);
      floatText(x, y, "CURVE", C.orange);
    } else if (effect === "multiball") {
      splitBall(b, x, y);
    }
  }

  function applyBreakEffect(block, b, x, y) {
    if (block.type === "bomb") {
      for (let i = state.blocks.length - 1; i >= 0; i--) {
        const other = state.blocks[i];
        const ox = other.x + other.w / 2;
        const oy = other.y + other.h / 2;

        if (Math.hypot(ox - x, oy - y) < 92) {
          state.blocks.splice(i, 1);
          addScore(40, ox, oy, "CHAIN");
          burst(ox, oy, blockColor(other), 14);
        }
      }

      b.vx *= 1.12;
      b.vy *= 1.12;
      burst(x, y, C.red, 42);
    }

    if (block.type === "boss") {
      state.enemy.stun = Math.max(state.enemy.stun, 0.9 + state.mods.enemyStunBonus);
      state.mods.shield++;
      floatText(x, y - 24, "BOSS CORE", C.text);
    }
  }

  function blockScore(block) {
    return block.type === "spike" ? 80 :
      block.type === "portal" ? 95 :
      block.type === "splitter" ? 105 :
      block.type === "moving" ? 120 :
      block.type === "regen" ? 135 :
      block.type === "shielded" ? 150 :
      block.type === "bomb" ? 170 :
      block.type === "boss" ? 420 :
      block.type === "bonus" ? 180 :
      50;
  }

  function hurtPlayer(n) {
    if (state.player.invuln > 0) return;

    if (state.mods.shield > 0) {
      state.mods.shield--;
      floatText(90, state.player.y, "SHIELD", C.cyan);
      burst(state.player.x + 14, state.player.y, C.cyan, 28);
      return;
    }

    state.player.hp -= n;
    state.player.invuln = 1;
    state.combo = 0;
    state.flash = 0.2;
    burst(state.player.x, state.player.y, C.pink, 34);

    if (state.player.hp <= 0) {
      state.mode = "gameover";
      saveBest();
      syncButton();
    }
  }

  function hitEnemy(n, x, y) {
    if (Math.random() < state.mods.crit) {
      n *= 2;
      floatText(x, y - 20, "CRIT", C.gold);
    }

    state.enemy.hp -= n;
    state.enemy.stun = Math.max(state.enemy.stun, 0.12);
    addScore(70 * n, x, y, "-" + n + " HP");
    burst(x, y, state.enemy.color, 20 + n * 5);

    if (state.enemy.hp <= 0 && state.mode === "playing") {
      state.balls = [];
      addScore(250 + state.room * 50, W / 2, H / 2, "LEVEL CLEAR");
      state.mode = "cleared";
      setTimeout(() => { if (state.mode === "cleared") createDraft(); }, 350);
    }
  }

  function addScore(points, x, y, label) {
    const scale = state.mods ? state.mods.scoreScale : 1;
    const gain = Math.round(points * scale * (1 + Math.min(1.8, state.combo * 0.055)));
    state.score += gain;
    state.combo++;
    state.comboTimer = state.mods ? state.mods.comboWindow : 2;
    floatText(x, y, label || "+" + gain, C.gold);
  }

  function floatText(x, y, text, color) {
    state.floats.push({ x, y, text, color, life: 0.82, vy: -38 });
  }

  function burst(x, y, color, n) {
    for (let i = 0; i < n; i++) {
      const a = rand(0, Math.PI * 2);
      const s = rand(35, 240);

      state.particles.push({
        x,
        y,
        vx: Math.cos(a) * s,
        vy: Math.sin(a) * s,
        r: rand(1.2, 3.4),
        color,
        life: rand(0.25, 0.85)
      });
    }
  }

  function updateEffects(dt) {
    for (const p of state.particles) {
      p.x += p.vx * dt;
      p.y += p.vy * dt;
      p.vx *= Math.pow(0.06, dt);
      p.vy *= Math.pow(0.06, dt);
      p.life -= dt;
    }

    state.particles = state.particles.filter(p => p.life > 0);

    for (const f of state.floats) {
      f.y += f.vy * dt;
      f.life -= dt;
    }

    state.floats = state.floats.filter(f => f.life > 0);
  }

  function saveBest() {
    if (state.score > state.best) {
      state.best = state.score;
      store.set("thats-a-paddlin-best", state.best);
    }
  }

  function mainBall() {
    return state.balls[0] || null;
  }

  function physicsValues() {
    const b = mainBall();
    const p = state.player;
    const sp = speedOf(b);
    const spin = b ? b.spin : 0;
    const angle = p ? radToDeg(p.angle) : 0;
    const intent = state.spinIntent || 0;

    return [
      ["Ball", sp.toFixed(0) + " px/s", C.cyan],
      ["Soft cap", CFG.ball.speedSoftCap + " px/s", C.gold],
      ["Contact", b ? b.contactSpeed.toFixed(0) + " px/s" : "0 px/s", C.gold],
      ["Paddle hit V", b ? b.paddleSpeedAtContact.toFixed(0) + " px/s" : "0 px/s", C.text],
      ["VX / VY", b ? b.vx.toFixed(0) + " / " + b.vy.toFixed(0) : "0 / 0", C.text],
      ["Spin", spin.toFixed(2), spin >= 0 ? C.gold : C.purple],
      ["Spin load", Math.round(Math.abs(intent) * 100) + "%", intent >= 0 ? C.gold : C.purple],
      ["Magnus", b ? b.lift.toFixed(0) + " px/s²" : "0 px/s²", C.text],
      ["Angle", angle.toFixed(0) + "°" + (p && p.angleLocked ? " locked" : ""), C.cyan],
      ["Paddle XY", p ? p.x.toFixed(0) + " / " + p.y.toFixed(0) : "0 / 0", C.text],
      ["Paddle V", p ? p.vx.toFixed(0) + " / " + p.vy.toFixed(0) : "0 / 0", C.text],
      ["Mouse response", paddleFollowMultiplier().toFixed(2) + "×", C.text],
      ["Spin decay", CFG.ball.spinDecay.toFixed(3) + "/s", C.text],
      ["Wall keep", Math.round(CFG.ball.wallSpinKeep * 100) + "%", C.text],
      ["Stall", b ? b.stallTimer.toFixed(1) + "s" : "0s", C.text],
      ["Enemy AI", Math.round(levelT() * 100) + "%", C.pink],
      ["Band", levelBand(), C.green],
      ["Respawn", respawnDelay().toFixed(2) + "s", C.text],
      ["Blocks", state.blocks.length + "+" + state.previews.length + "/" + targetBlocks(), C.text],
      ["Shield", String(state.mods ? state.mods.shield : 0), C.text],
      ["Crit", Math.round((state.mods ? state.mods.crit : 0) * 100) + "%", C.text]
    ];
  }

  function draw() {
    ctx.clearRect(0, 0, W, H);

    ctx.save();

    drawBackground();
    drawArena();
    drawPlayerZone();
    drawPreviews();
    drawBlocks();

    if (state.player && state.enemy) {
      drawPaddle(state.player, state.player.invuln > 0 ? 0.55 : 1, true);
      drawPaddle(state.enemy, state.enemy.stun > 0 ? 0.55 : 1, false);
    }

    drawBalls();
    drawEffects();
    drawHud();

    ctx.restore();

    if (state.flash > 0) {
      ctx.fillStyle = `rgba(255,95,126,${state.flash})`;
      ctx.fillRect(0, 0, W, H);
    }

    if (state.mode === "title") drawTitle();
    if (state.mode === "upgrade") drawUpgrade();
    if (state.mode === "gameover") drawEnd(false);
    if (state.mode === "victory") drawEnd(true);
    if (state.paused) drawPause();
  }

  function drawBackground() {
    const g = ctx.createLinearGradient(0, 0, W, H);

    g.addColorStop(0, "#101735");
    g.addColorStop(0.56, "#070914");
    g.addColorStop(1, "#16091c");

    ctx.fillStyle = g;
    ctx.fillRect(0, 0, W, H);

    ctx.save();
    ctx.globalAlpha = 0.15;
    ctx.strokeStyle = C.cyan;

    for (let x = -H; x < W + H; x += 48) {
      ctx.beginPath();
      ctx.moveTo(x, 0);
      ctx.lineTo(x - H * 0.22, H);
      ctx.stroke();
    }

    ctx.restore();
  }

  function drawArena() {
    ctx.save();
    ctx.strokeStyle = "rgba(255,255,255,0.16)";
    ctx.lineWidth = 2;

    round(CFG.arena.pad, CFG.arena.pad, W - CFG.arena.pad * 2, H - CFG.arena.pad * 2, 22);
    ctx.stroke();

    ctx.setLineDash([8, 14]);
    ctx.beginPath();
    ctx.moveTo(W / 2, 30);
    ctx.lineTo(W / 2, H - 30);
    ctx.stroke();

    ctx.restore();
  }

  function drawPlayerZone() {
    const z = playerZone();

    ctx.save();
    ctx.globalAlpha = 0.09;
    ctx.fillStyle = C.cyan;
    round(z.minX, CFG.arena.pad + 12, z.maxX - z.minX + 10, H - CFG.arena.pad * 2 - 24, 18);
    ctx.fill();

    ctx.globalAlpha = 0.22;
    ctx.strokeStyle = C.cyan;
    ctx.setLineDash([8, 10]);
    round(z.minX, CFG.arena.pad + 12, z.maxX - z.minX + 10, H - CFG.arena.pad * 2 - 24, 18);
    ctx.stroke();
    ctx.restore();
  }

  function drawPreviews() {
    for (const p of state.previews) {
      const ratio = clamp(1 - p.time / p.total, 0, 1);
      const col = blockColor(p);

      ctx.save();
      ctx.globalAlpha = 0.22 + ratio * 0.35 + Math.sin(performance.now() / 120) * 0.06;
      ctx.strokeStyle = col;
      ctx.fillStyle = col;
      ctx.lineWidth = 2;
      ctx.setLineDash([7, 7]);

      round(p.x, p.y, p.w, p.h, 7);
      ctx.stroke();

      ctx.globalAlpha = 0.10 + ratio * 0.18;
      ctx.fill();

      ctx.setLineDash([]);
      ctx.globalAlpha = 0.95;
      ctx.fillStyle = C.text;
      ctx.font = "800 11px ui-sans-serif, system-ui";
      ctx.textAlign = "center";
      ctx.fillText(p.time.toFixed(1), p.x + p.w / 2, p.y - 7);

      ctx.restore();
    }
  }

  function drawBlocks() {
    for (const b of state.blocks) {
      const col = blockColor(b);

      ctx.save();
      ctx.shadowColor = col;
      ctx.shadowBlur = b.type === "portal" ? 18 : 8;
      ctx.fillStyle = col;
      ctx.globalAlpha = b.type === "stone" ? 0.75 : 0.9;

      round(b.x, b.y, b.w, b.h, 7);
      ctx.fill();

      ctx.globalAlpha = 1;
      ctx.shadowBlur = 0;
      ctx.strokeStyle = "rgba(255,255,255,0.24)";
      ctx.stroke();

      if (b.maxHp > 1) {
        ctx.fillStyle = "rgba(0,0,0,0.36)";
        ctx.fillRect(b.x + 6, b.y + b.h - 7, b.w - 12, 3);
        ctx.fillStyle = C.text;
        ctx.fillRect(b.x + 6, b.y + b.h - 7, (b.w - 12) * b.hp / b.maxHp, 3);
      }

      if (b.type === "spike") drawSpikes(b);
      if (b.type === "portal") drawPortal(b);
      if (b.type === "splitter") drawSplitter(b);
      if (b.type === "bomb") drawBomb(b);
      if (b.type === "bonus") drawBonus(b);
      if (b.type === "shielded") drawShielded(b);
      if (b.type === "boss") drawBoss(b);

      ctx.restore();
    }
  }

  function drawSpikes(b) {
    ctx.fillStyle = "rgba(0,0,0,0.38)";

    for (let i = 0; i < 3; i++) {
      const x = b.x + b.w * (0.18 + i * 0.28);
      ctx.beginPath();
      ctx.moveTo(x, b.y + b.h - 4);
      ctx.lineTo(x + b.w * 0.12, b.y + 5);
      ctx.lineTo(x + b.w * 0.24, b.y + b.h - 4);
      ctx.fill();
    }
  }

  function drawPortal(b) {
    ctx.strokeStyle = "rgba(255,255,255,0.76)";
    ctx.beginPath();
    ctx.ellipse(b.x + b.w / 2, b.y + b.h / 2, b.w * 0.30, b.h * 0.28, performance.now() / 350, 0, Math.PI * 2);
    ctx.stroke();
  }

  function drawSplitter(b) {
    ctx.strokeStyle = "rgba(255,255,255,0.72)";
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(b.x + b.w * 0.28, b.y + b.h * 0.25);
    ctx.lineTo(b.x + b.w * 0.72, b.y + b.h * 0.5);
    ctx.lineTo(b.x + b.w * 0.28, b.y + b.h * 0.75);
    ctx.stroke();
  }

  function drawBomb(b) {
    ctx.fillStyle = "rgba(0,0,0,0.5)";
    ctx.beginPath();
    ctx.arc(b.x + b.w / 2, b.y + b.h / 2, Math.min(b.w, b.h) * 0.28, 0, Math.PI * 2);
    ctx.fill();
  }

  function drawBonus(b) {
    ctx.fillStyle = "rgba(0,0,0,0.48)";
    ctx.font = "900 15px ui-sans-serif, system-ui";
    ctx.textAlign = "center";
    ctx.fillText("+", b.x + b.w / 2, b.y + b.h / 2 + 5);
  }

  function drawShielded(b) {
    ctx.strokeStyle = "rgba(255,255,255,0.76)";
    ctx.lineWidth = 2;
    round(b.x + 4, b.y + 4, b.w - 8, b.h - 8, 5);
    ctx.stroke();
  }

  function drawBoss(b) {
    ctx.strokeStyle = C.red;
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(b.x + b.w * 0.22, b.y + b.h * 0.5);
    ctx.lineTo(b.x + b.w * 0.5, b.y + b.h * 0.18);
    ctx.lineTo(b.x + b.w * 0.78, b.y + b.h * 0.5);
    ctx.lineTo(b.x + b.w * 0.5, b.y + b.h * 0.82);
    ctx.closePath();
    ctx.stroke();
  }

  function drawPaddle(p, alpha = 1, angled = true) {
    ctx.save();

    ctx.translate(p.x, p.y);
    if (angled) ctx.rotate(p.angle);

    ctx.globalAlpha = alpha;
    ctx.shadowColor = p.color;
    ctx.shadowBlur = 18;

    const g = ctx.createLinearGradient(-p.w / 2, -p.h / 2, p.w / 2, p.h / 2);
    g.addColorStop(0, p.color);
    g.addColorStop(1, "#ffffff");

    ctx.fillStyle = g;
    round(-p.w / 2, -p.h / 2, p.w, p.h, 8);
    ctx.fill();

    if (angled && p.angleLocked) {
      ctx.shadowBlur = 0;
      ctx.strokeStyle = C.gold;
      ctx.lineWidth = 2;
      round(-p.w / 2 - 3, -p.h / 2 - 3, p.w + 6, p.h + 6, 10);
      ctx.stroke();
    }

    if (angled && p === state.player && Math.abs(state.spinIntent) > 0.04) {
      const sign = Math.sign(state.spinIntent);
      const load = Math.abs(state.spinIntent);

      ctx.shadowBlur = 0;
      ctx.globalAlpha = 0.32 + load * 0.5;
      ctx.strokeStyle = sign > 0 ? C.gold : C.purple;
      ctx.lineWidth = 2 + load * 2;
      ctx.beginPath();
      ctx.moveTo(-p.w / 2 - 8, -p.h / 2 + 4);
      ctx.quadraticCurveTo(-p.w / 2 - 10 - load * 18 * sign, 0, -p.w / 2 - 8, p.h / 2 - 4);
      ctx.stroke();
    }

    ctx.restore();
  }

  function drawBalls() {
    for (const b of state.balls) {
      for (let i = 0; i < b.trail.length; i++) {
        const t = b.trail[i];

        ctx.save();
        ctx.globalAlpha = (i / b.trail.length) * 0.23;
        ctx.fillStyle = Math.abs(b.spin) > 0.7 ? C.gold : C.cyan;
        ctx.beginPath();
        ctx.arc(t.x, t.y, b.r * (i / b.trail.length), 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      }

      ctx.save();
      ctx.shadowColor = Math.abs(b.spin) > 0.7 ? C.gold : C.cyan;
      ctx.shadowBlur = 22;

      const g = ctx.createRadialGradient(b.x - 3, b.y - 3, 1, b.x, b.y, b.r + 5);
      g.addColorStop(0, "#fff");
      g.addColorStop(0.5, C.cyan);
      g.addColorStop(1, "rgba(255,255,255,0.16)");

      ctx.fillStyle = g;
      ctx.beginPath();
      ctx.arc(b.x, b.y, b.r, 0, Math.PI * 2);
      ctx.fill();

      if (Math.abs(b.spin) > 0.06) {
        const a = performance.now() / 120 * (b.spin > 0 ? 1 : -1);

        ctx.globalAlpha = clamp(Math.abs(b.spin) / 2.5, 0.24, 0.95);
        ctx.shadowBlur = 0;
        ctx.strokeStyle = b.spin > 0 ? C.gold : C.purple;
        ctx.lineWidth = 2.2;
        ctx.beginPath();
        ctx.arc(b.x, b.y, b.r + 5, a, a + Math.PI * 1.25);
        ctx.stroke();
      }

      ctx.restore();
    }
  }

  function drawEffects() {
    for (const p of state.particles) {
      ctx.save();
      ctx.globalAlpha = clamp(p.life, 0, 1);
      ctx.fillStyle = p.color;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    }

    for (const f of state.floats) {
      ctx.save();
      ctx.globalAlpha = clamp(f.life * 1.25, 0, 1);
      ctx.fillStyle = f.color;
      ctx.font = "800 16px ui-sans-serif, system-ui";
      ctx.textAlign = "center";
      ctx.fillText(f.text, f.x, f.y);
      ctx.restore();
    }
  }

  function drawHud() {
    if (!state.player || !state.enemy) return;

    const w = Math.min(Math.max(560, W * 0.54), W - 28);
    const h = W < 760 ? 128 : 96;
    const x = W / 2 - w / 2;
    const y = 10;

    ctx.save();
    ctx.fillStyle = "rgba(0,0,0,0.34)";
    round(x, y, w, h, 14);
    ctx.fill();

    ctx.strokeStyle = "rgba(255,255,255,0.14)";
    ctx.stroke();

    drawStats(x, y, w);
    drawPhysics(x, y + 40, w);

    if (state.messageTimer > 0) {
      ctx.textAlign = "center";
      ctx.fillStyle = `rgba(245,247,255,${clamp(state.messageTimer, 0, 1)})`;
      ctx.font = "900 42px ui-sans-serif, system-ui";
      ctx.fillText(state.message, W / 2, H / 2 - 116);
    }

    if (state.freeServe) {
      ctx.textAlign = "center";
      ctx.fillStyle = C.cyan;
      ctx.font = "900 18px ui-sans-serif, system-ui";
      ctx.fillText("Click or press Space to serve", W / 2, H / 2 - 74);
    }

    ctx.restore();
  }

  function drawStats(x, y, w) {
    const c = x + w / 2;

    ctx.textAlign = "center";
    ctx.fillStyle = C.text;
    ctx.font = "900 13px ui-sans-serif, system-ui";
    ctx.fillText("Level " + state.room + "/" + CFG.rooms, c - w * 0.38, y + 20);

    drawHearts(c - w * 0.27, y + 18);
    drawEnemyBar(c - w * 0.07, y + 12, Math.min(150, w * 0.22));

    ctx.fillStyle = C.gold;
    ctx.font = "900 14px ui-sans-serif, system-ui";
    ctx.fillText(String(state.score).padStart(6, "0"), c + w * 0.31, y + 20);

    ctx.fillStyle = C.muted;
    ctx.font = "700 10px ui-sans-serif, system-ui";
    ctx.fillText("BEST " + state.best, c + w * 0.31, y + 34);
  }

  function drawEnemyBar(x, y, w) {
    ctx.fillStyle = "rgba(255,255,255,0.12)";
    round(x, y, w, 8, 6);
    ctx.fill();

    ctx.fillStyle = state.enemy.color;
    round(x, y, w * clamp(state.enemy.hp / state.enemy.maxHp, 0, 1), 8, 6);
    ctx.fill();

    ctx.fillStyle = C.muted;
    ctx.font = "700 10px ui-sans-serif, system-ui";
    ctx.textAlign = "center";
    ctx.fillText("Enemy " + Math.max(0, state.enemy.hp) + "/" + state.enemy.maxHp, x + w / 2, y + 22);
  }

  function drawPhysics(x, y, w) {
    const cols = W < 760 ? 3 : 6;
    const colW = w / cols;
    const rowH = W < 760 ? 14 : 13;

    ctx.font = "800 9px ui-sans-serif, system-ui";
    ctx.textAlign = "left";

    physicsValues().forEach(([label, value, color], i) => {
      const tx = x + 12 + (i % cols) * colW;
      const ty = y + Math.floor(i / cols) * rowH;

      ctx.fillStyle = C.muted;
      ctx.fillText(label, tx, ty);

      ctx.fillStyle = color || C.text;
      ctx.fillText(value, tx + 52, ty);
    });
  }

  function drawHearts(x, y) {
    for (let i = 0; i < state.mods.maxHp; i++) {
      ctx.fillStyle = i < state.player.hp ? C.pink : "rgba(255,255,255,0.16)";
      heart(x + i * 16, y, 6);
      ctx.fill();
    }
  }

  function drawTitle() {
    overlay(0.75);
    ctx.save();
    ctx.textAlign = "center";

    ctx.fillStyle = C.text;
    ctx.font = `900 ${clamp(W * 0.07, 42, 76)}px ui-sans-serif, system-ui`;
    ctx.fillText("that's a paddlin", W / 2, H * 0.28);

    ctx.fillStyle = C.cyan;
    ctx.font = "900 22px ui-sans-serif, system-ui";
    ctx.fillText("100-level quantum-curved roguelike pong", W / 2, H * 0.28 + 42);

    ctx.fillStyle = C.muted;
    ctx.font = "600 18px ui-sans-serif, system-ui";
    wrapText(
      "Move the paddle with mouse or touch inside the left-side zone. Hold A/D or ←/→ to rotate and load spin for the next hit. Smaller paddles, faster balls, denser blocks, escalating block effects, and an enemy AI that grows from level 0 training dummy to level 100 apex defender.",
      W / 2,
      H * 0.44,
      Math.min(860, W - 50),
      28
    );

    drawButton(W / 2 - 132, H * 0.62, 264, 58, "Start game", C.cyan);
    ctx.restore();
  }

  function drawUpgrade() {
    overlay(0.78);
    ctx.save();
    ctx.textAlign = "center";

    ctx.fillStyle = C.text;
    ctx.font = "900 44px ui-sans-serif, system-ui";
    ctx.fillText("Choose an Upgrade", W / 2, 92);

    ctx.fillStyle = C.muted;
    ctx.font = "700 16px ui-sans-serif, system-ui";
    ctx.fillText("Click a card or press 1, 2, or 3.", W / 2, 122);

    const compact = W < 820;
    const cw = compact ? Math.min(280, W - 40) : 250;
    const ch = compact ? 132 : 220;
    const gap = 18;
    const sx = compact ? W / 2 - cw / 2 : W / 2 - (cw * 3 + gap * 2) / 2;
    const sy = compact ? 150 : 180;

    state.draft.forEach((r, i) => {
      drawCard(
        r,
        i,
        compact ? sx : sx + i * (cw + gap),
        compact ? sy + i * (ch + 14) : sy,
        cw,
        ch,
        compact
      );
    });

    ctx.restore();
  }

  function drawCard(r, i, x, y, w, h, compact) {
    ctx.save();

    ctx.fillStyle = "rgba(14,18,37,0.94)";
    ctx.strokeStyle = "rgba(255,255,255,0.18)";
    ctx.lineWidth = 2;

    round(x, y, w, h, 18);
    ctx.fill();
    ctx.stroke();

    ctx.fillStyle = C.gold;
    ctx.font = compact ? "900 34px ui-sans-serif, system-ui" : "900 48px ui-sans-serif, system-ui";
    ctx.fillText(r.icon, x + w / 2, y + (compact ? 42 : 64));

    ctx.fillStyle = C.text;
    ctx.font = compact ? "900 18px ui-sans-serif, system-ui" : "900 22px ui-sans-serif, system-ui";
    ctx.fillText((i + 1) + ". " + r.name, x + w / 2, y + (compact ? 72 : 106));

    ctx.fillStyle = C.muted;
    ctx.font = compact ? "700 13px ui-sans-serif, system-ui" : "700 15px ui-sans-serif, system-ui";
    wrapText(r.desc, x + w / 2, y + (compact ? 98 : 144), w - 42, compact ? 18 : 22);

    ctx.restore();
  }

  function drawEnd(victory) {
    overlay(0.76);
    ctx.save();
    ctx.textAlign = "center";

    ctx.fillStyle = victory ? C.gold : C.pink;
    ctx.font = `900 ${clamp(W * 0.06, 42, 64)}px ui-sans-serif, system-ui`;
    ctx.fillText(victory ? "Dungeon Cleared" : "Run Ended", W / 2, H * 0.32);

    ctx.fillStyle = C.text;
    ctx.font = "900 26px ui-sans-serif, system-ui";
    ctx.fillText("Score " + state.score + " · Best " + state.best, W / 2, H * 0.32 + 50);

    drawButton(W / 2 - 120, H * 0.54, 240, 54, "Restart", victory ? C.gold : C.pink);

    ctx.restore();
  }

  function drawPause() {
    overlay(0.68);
    ctx.save();
    ctx.textAlign = "center";

    ctx.fillStyle = C.text;
    ctx.font = "900 54px ui-sans-serif, system-ui";
    ctx.fillText("Paused", W / 2, H * 0.18);

    const boxW = Math.min(760, W - 38);
    const boxH = 402;
    const x = W / 2 - boxW / 2;
    const y = H * 0.25;

    ctx.fillStyle = "rgba(14,18,37,0.92)";
    round(x, y, boxW, boxH, 18);
    ctx.fill();

    ctx.strokeStyle = "rgba(255,255,255,0.18)";
    ctx.stroke();

    [
      "Controls",
      "Mouse/touch: move paddle in left-side zone along X and Y",
      "Paddle movement auto-angles paddle up to ±160°",
      "A/D or ←/→: rotate and load spin for the next hit",
      "L: lock/unlock current angle · X: unlock auto-angle",
      "Shift: faster mouse response · Alt/Ctrl: precision response",
      "Click or Space: launch the free serve at the start of each level",
      "Contact speed increases ball speed; speed/spin use soft caps",
      "1/2/3: choose upgrade · P: resume · R: restart"
    ].forEach((line, i) => {
      ctx.fillStyle = i === 0 ? C.cyan : C.muted;
      ctx.font = i === 0 ? "900 20px ui-sans-serif, system-ui" : "700 15px ui-sans-serif, system-ui";
      ctx.fillText(line, W / 2, y + 34 + i * 27);
    });

    ctx.textAlign = "left";
    ctx.fillStyle = C.gold;
    ctx.font = "900 14px ui-sans-serif, system-ui";
    ctx.fillText("Live physics", x + 28, y + 286);

    ctx.fillStyle = C.muted;
    ctx.font = "700 12px ui-sans-serif, system-ui";

    physicsValues().slice(0, 12).forEach(([l, v], i) => {
      ctx.fillText(
        l + ": " + v,
        x + 28 + (i % 2) * (boxW / 2 - 12),
        y + 310 + Math.floor(i / 2) * 18
      );
    });

    ctx.restore();
  }

  function overlay(a) {
    ctx.fillStyle = `rgba(5,7,18,${a})`;
    ctx.fillRect(0, 0, W, H);
  }

  function drawButton(x, y, w, h, text, color) {
    ctx.save();

    ctx.shadowColor = color;
    ctx.shadowBlur = 18;
    ctx.fillStyle = color;

    round(x, y, w, h, 16);
    ctx.fill();

    ctx.shadowBlur = 0;
    ctx.fillStyle = "rgba(0,0,0,0.72)";
    ctx.font = "900 18px ui-sans-serif, system-ui";
    ctx.textAlign = "center";
    ctx.fillText(text, x + w / 2, y + h / 2 + 6);

    ctx.restore();
  }

  function wrapText(text, x, y, maxW, lineH) {
    const words = text.split(" ");
    let line = "";

    for (const word of words) {
      const test = line + word + " ";

      if (ctx.measureText(test).width > maxW && line) {
        ctx.fillText(line.trim(), x, y);
        line = word + " ";
        y += lineH;
      } else {
        line = test;
      }
    }

    ctx.fillText(line.trim(), x, y);
  }

  function round(x, y, w, h, r) {
    r = Math.min(r, w / 2, h / 2);

    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }

  function heart(x, y, s) {
    ctx.beginPath();
    ctx.moveTo(x, y + s * 0.35);
    ctx.bezierCurveTo(x - s * 1.2, y - s * 0.55, x - s * 1.8, y + s * 0.55, x, y + s * 1.55);
    ctx.bezierCurveTo(x + s * 1.8, y + s * 0.55, x + s * 1.2, y - s * 0.55, x, y + s * 0.35);
    ctx.closePath();
  }

  function canvasPoint(e) {
    const r = canvas.getBoundingClientRect();
    return { x: e.clientX - r.left, y: e.clientY - r.top };
  }

  function clickAt(x, y) {
    if (["title", "gameover", "victory"].includes(state.mode)) {
      newRun();
      return;
    }

    if (launchFreeServe()) return;

    if (state.mode !== "upgrade") return;

    const compact = W < 820;
    const cw = compact ? Math.min(280, W - 40) : 250;
    const ch = compact ? 132 : 220;
    const gap = 18;
    const sx = compact ? W / 2 - cw / 2 : W / 2 - (cw * 3 + gap * 2) / 2;
    const sy = compact ? 150 : 180;

    for (let i = 0; i < 3; i++) {
      const cx = compact ? sx : sx + i * (cw + gap);
      const cy = compact ? sy + i * (ch + 14) : sy;

      if (x >= cx && x <= cx + cw && y >= cy && y <= cy + ch) {
        chooseRelic(i);
      }
    }
  }

  function syncButton() {
    if (state.mode === "title") {
      actionButton.hidden = false;
      actionButton.textContent = "Start game";
    } else if (state.mode === "gameover" || state.mode === "victory") {
      actionButton.hidden = false;
      actionButton.textContent = "Restart";
    } else {
      actionButton.hidden = true;
    }
  }

  function updatePointer(e, force = false) {
    const p = canvasPoint(e);
    const z = playerZone();
    const moved = pointer.lastX === null || Math.hypot(p.x - pointer.lastX, p.y - pointer.lastY) > 2;

    pointer.lastX = p.x;
    pointer.lastY = p.y;

    if (force || moved) {
      pointer.active = true;
      pointer.x = clamp(p.x, z.minX + CFG.paddle.w / 2, z.maxX);
      pointer.y = clamp(p.y, 24, H - 24);
    }

    return p;
  }

  actionButton.addEventListener("click", newRun);

  canvas.addEventListener("pointerdown", e => {
    const p = updatePointer(e, true);
    clickAt(p.x, p.y);
    canvas.focus();
    e.preventDefault();
  });

  canvas.addEventListener("pointermove", e => {
    updatePointer(e);
    e.preventDefault();
  });

  canvas.addEventListener("pointerleave", e => {
    if (e.pointerType !== "mouse") pointer.active = false;
  });

  canvas.addEventListener("touchmove", e => e.preventDefault(), { passive: false });

  window.addEventListener("keydown", e => {
    keys.add(e.code);

    if (["Space", "ArrowUp", "ArrowDown", "ArrowLeft", "ArrowRight"].includes(e.code)) {
      e.preventDefault();
    }

    if (e.code === "Space") {
      if (["title", "gameover", "victory"].includes(state.mode)) newRun();
      else if (launchFreeServe()) return;
      else if (state.mode === "playing" && !state.balls.length) serve(1);
    }

    if (e.code === "KeyR") newRun();

    if (e.code === "KeyP" && state.mode === "playing") {
      state.paused = !state.paused;
    }

    if (e.code === "KeyL" && state.player) {
      state.player.angleLocked = !state.player.angleLocked;
      state.player.manualAngle = state.player.angle;
    }

    if (e.code === "KeyX" && state.player) {
      state.player.angleLocked = false;
    }

    if (
      state.mode === "upgrade" &&
      ["Digit1", "Digit2", "Digit3", "Numpad1", "Numpad2", "Numpad3"].includes(e.code)
    ) {
      chooseRelic(Number(e.code.replace("Digit", "").replace("Numpad", "")) - 1);
    }
  });

  window.addEventListener("keyup", e => keys.delete(e.code));

  window.addEventListener("blur", () => {
    keys.clear();
    if (state.mode === "playing") state.paused = true;
  });

  window.addEventListener("resize", resize);
  window.addEventListener("orientationchange", resize);

  function loop(t) {
    const dt = Math.min(0.016, (t - state.last) / 1000 || 0);
    state.last = t;

    update(dt);
    draw();

    requestAnimationFrame(loop);
  }

  resize();
  syncButton();
  draw();
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
